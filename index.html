<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic Weisser | AI & Earth Observation</title>
    <script src="//unpkg.com/three@0.148.0/build/three.min.js"></script>
    <script src="//unpkg.com/globe.gl@2.26.4/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 320px;
            --bg-color: #010204;
            --accent-color: #00ffcc;
            --glass-bg: rgba(6, 9, 15, 0.95);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* HUD Header */
        .header-overlay { 
            position: absolute; top: 30px; left: 80px; z-index: 10; pointer-events: none;
            border-left: 3px solid var(--accent-color); padding-left: 20px;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
        .subtitle { color: var(--accent-color); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; margin-top: 5px; letter-spacing: 1px; }

        /* Scanning Line Effect */
        .header-overlay::after {
            content: ""; position: absolute; top: 0; left: -3px; width: 3px; height: 100%;
            background: var(--accent-color); animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { height: 0%; top: 0; } 50% { height: 100%; top: 0; } 100% { height: 0%; top: 100%; } }

        /* Layer Switcher */
        .layer-control {
            position: absolute; bottom: 40px; right: 30px; z-index: 20;
            background: var(--glass-bg); padding: 20px; border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.2); display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        .layer-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: #666; padding: 12px 18px; font-size: 0.75rem; cursor: pointer;
            border-radius: 6px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); text-align: left;
        }
        .layer-btn:hover { background: rgba(0, 255, 204, 0.05); color: #fff; }
        .layer-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: rgba(0, 255, 204, 0.1); box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); }

        /* UI elements */
        .menu-btn { position: fixed; top: 25px; left: 20px; z-index: 30; background: var(--glass-bg); color: var(--accent-color); border: 1px solid var(--accent-color); padding: 12px 15px; border-radius: 8px; cursor: pointer; font-family: 'JetBrains Mono'; }
        .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-width); height: 100%; background: var(--glass-bg); z-index: 25; transform: translateX(-100%); transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1); padding: 100px 40px; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar.open { transform: translateX(0); }
        .close-btn { position: absolute; top: 30px; right: 30px; cursor: pointer; color: var(--accent-color); font-size: 1.5rem; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); }
        .modal-content { background: #080a0f; margin: 5% auto; padding: 50px; border: 1px solid rgba(0, 255, 204, 0.3); width: 80%; max-width: 800px; border-radius: 4px; position: relative; }
        .modal-content h2 { margin-top: 0; letter-spacing: 1px; text-transform: uppercase; }

        /* Image Comparison Container */
        .comparison-container { position: relative; width: 100%; margin: 30px 0; border: 1px solid #222; overflow: hidden; }
        .img-overlay { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; border-right: 2px solid var(--accent-color); z-index: 2; }
        .slider-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; z-index: 10; }
    </style>
</head>

<body>
    <div id="globeViz"></div>

    <div class="header-overlay">
        <h1>Dominic Weisser</h1>
        <div class="subtitle">AI for Sustainable Development & Earth Observation</div>
    </div>

    <div class="layer-control">
        <button class="layer-btn active" onclick="setLayer('topo', this)">01. Topography & Terrain</button>
        <button class="layer-btn" onclick="setLayer('night', this)">02. Socio-Economic (Night)</button>
        <button class="layer-btn" onclick="setLayer('currents', this)">03. Ocean Current Flow</button>
    </div>

    <button class="menu-btn" onclick="toggleSidebar()">[ MENU ]</button>

    <div class="sidebar" id="mySidebar">
        <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        <h2 style="color: var(--accent-color); font-size: 1rem; letter-spacing: 2px;">PROJECT INDEX</h2>
        <div id="project-list" style="margin-top: 30px;"></div>
    </div>

    <div id="projectModal" class="modal-overlay">
        <div class="modal-content">
            <span onclick="closeModal()" style="position: absolute; top: 20px; right: 30px; cursor: pointer; font-size: 2rem;">&times;</span>
            <h2 id="modalTitle" style="color: var(--accent-color);"></h2>
            <div id="modalBody" style="line-height: 1.8; color: #aaa; font-size: 0.95rem;"></div>
        </div>
    </div>

    <script>
        const myProjects = [
            { lat: -1.2921, lng: 36.8219, name: "Kenya", fullName: "EOAgriTwin - Kenya" },
            { lat: 54.1153, lng: 4.3162, name: "Northern Europe", fullName: "MSc Dissertation: Wind Power Forecasting", desc: "Supervised by Professor Benjami Guedj, investigating transfer learning through meteorological clusters." },
            { lat: 41.9028, lng: 12.4964, name: "Italy", fullName: "EOAgriTwin - Italy" },
            { lat: -15.8267, lng: -47.9218, name: "Brazil", fullName: "Amazon Groundwater Monitoring" },
            { lat: 42.6977, lng: 23.3219, name: "Bulgaria", fullName: "CarbComply - Bulgaria" },
            { lat: 48.2082, lng: 16.3738, name: "Austria", fullName: "CarbComply - Austria" },
            { lat: 78.2232, lng: 15.6267, name: "Arctic", fullName: "Arctic: Ocean Eddies Detection" }
        ];

        // CONFIG
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#00ffcc')
            .atmosphereDaylightAlpha(0.1)
            // Rings
            .ringsData(myProjects)
            .ringColor(() => '#00ffcc')
            .ringMaxRadius(2.5)
            .ringPropagationSpeed(1)
            // Labels
            .labelsData(myProjects)
            .labelText('name')
            .labelSize(1.6)
            .labelColor(() => '#ffffff')
            .labelDotRadius(0.4)
            .onLabelClick(openProject);

        // LIGHTING (Fixes Topography visibility)
        const scene = world.scene();
        scene.add(new THREE.AmbientLight(0xbbbbbb, 0.3));
        const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dLight.position.set(1, 1, 1);
        scene.add(dLight);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.6;

        // LAYER LOGIC
        function setLayer(type, btn) {
            document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'topo') {
                world.globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                     .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');
            } else if (type === 'night') {
                world.globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                     .bumpImageUrl('');
            } else if (type === 'currents') {
                // High-End Ocean Flow Texture
                world.globeImageUrl('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/earth-water.png')
                     .bumpImageUrl('');
            }
            
            // Re-sync projects
            world.ringsData(myProjects).labelsData(myProjects);
        }

        // UI FUNCTIONS
        function toggleSidebar() { document.getElementById('mySidebar').classList.toggle('open'); }
        function closeModal() { document.getElementById('projectModal').style.display = 'none'; world.controls().autoRotate = true; }
        
        function openProject(d) {
            document.getElementById('modalTitle').innerText = d.fullName;
            document.getElementById('modalBody').innerText = d.desc || "Analysis for this project is integrated within the AI4EO framework. Visualizing multi-sensor data pipelines...";
            document.getElementById('projectModal').style.display = 'block';
            world.controls().autoRotate = false;
        }

        // Project List
        const list = document.getElementById('project-list');
        myProjects.forEach(p => {
            const el = document.createElement('div');
            el.style.cssText = "padding: 12px 0; border-bottom: 1px solid #111; cursor: pointer; color: #888; font-size: 0.8rem;";
            el.innerHTML = `> ${p.fullName}`;
            el.onmouseover = () => el.style.color = 'var(--accent-color)';
            el.onmouseout = () => el.style.color = '#888';
            el.onclick = () => { openProject(p); toggleSidebar(); };
            list.appendChild(el);
        });
    </script>
</body>
</html>

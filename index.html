<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic Weisser | AI & Earth Observation</title>
    <script src="//unpkg.com/three@0.148.0/build/three.min.js"></script>
    <script src="//unpkg.com/globe.gl@2.26.4/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 320px;
            --bg-color: #020408;
            --accent-color: #00ffcc;
            --glass-bg: rgba(13, 17, 23, 0.95);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* HUD Header */
        .header-overlay { 
            position: absolute; top: 30px; left: 80px; z-index: 10; pointer-events: none;
            border-left: 3px solid var(--accent-color); padding-left: 20px;
        }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { color: var(--accent-color); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; margin-top: 5px; }

        /* Layer Panel */
        .layer-control {
            position: absolute; bottom: 40px; right: 30px; z-index: 20;
            background: var(--glass-bg); padding: 15px; border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.3); display: flex; flex-direction: column; gap: 8px;
        }
        .layer-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #888; padding: 10px; font-size: 0.7rem; cursor: pointer;
            border-radius: 4px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
            transition: 0.3s; text-align: left;
        }
        .layer-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: rgba(0, 255, 204, 0.1); }

        /* UI Elements */
        .menu-btn { position: fixed; top: 25px; left: 20px; z-index: 30; background: var(--glass-bg); color: var(--accent-color); border: 1px solid var(--accent-color); padding: 12px; border-radius: 6px; cursor: pointer; }
        .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-width); height: 100%; background: var(--glass-bg); z-index: 25; transform: translateX(-100%); transition: 0.4s; padding: 80px 30px; box-sizing: border-box; border-right: 1px solid #333; overflow-y: auto; }
        .sidebar.open { transform: translateX(0); }
        .modal-overlay { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #0d1117; margin: 5% auto; padding: 40px; border: 1px solid var(--accent-color); width: 80%; max-width: 800px; border-radius: 8px; position: relative; }
    </style>
</head>

<body>
    <div id="globeViz"></div>

    <div class="header-overlay">
        <h1>Dominic Weisser</h1>
        <div class="subtitle">MSc AI for Sustainable Development - UCL</div>
    </div>

    <div class="layer-control">
        <div style="font-size: 0.6rem; color: #666; font-weight: bold; margin-bottom: 5px;">SWITCH VIEW</div>
        <button class="layer-btn active" onclick="updateGlobeLayer('topo', this)">01. Topography (3D Terrain)</button>
        <button class="layer-btn" onclick="updateGlobeLayer('night', this)">02. Socio-Economic (Night)</button>
        <button class="layer-btn" onclick="updateGlobeLayer('dynamics', this)">03. Ocean & Wind Flow</button>
    </div>

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="mySidebar">
        <div onclick="toggleSidebar()" style="position: absolute; top: 25px; right: 25px; cursor: pointer;">✕</div>
        <h3 style="color: var(--accent-color);">Menu</h3>
        <div id="project-list" style="margin-top: 20px;"></div>
    </div>

    <div id="projectModal" class="modal-overlay">
        <div class="modal-content">
            <span onclick="closeModals()" style="position: absolute; top: 20px; right: 25px; cursor: pointer; font-size: 24px;">&times;</span>
            <h2 id="modalTitle" style="color: var(--accent-color);"></h2>
            <div id="modalBody" style="line-height: 1.6; color: #ccc; margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const myProjects = [
            { lat: -1.2921, lng: 36.8219, name: "Kenya", fullName: "EOAgriTwin - Kenya" },
            { lat: 54.1153, lng: 4.3162, name: "Northern Europe", fullName: "MSc Dissertation: Offshore Wind Power Forecasting", desc: "My MSc dissertation, supervised by Professor Benjami Guedj, investigates the application of transfer learning through weather specific models in offshore wind power forecasting." },
            { lat: 41.9028, lng: 12.4964, name: "Italy", fullName: "EOAgriTwin - Italy" },
            { lat: -15.8267, lng: -47.9218, name: "Brazil", fullName: "Predicting Monthly Groundwater Storage Changes in the Amazon Basin" },
            { lat: 42.6977, lng: 23.3219, name: "Bulgaria", fullName: "CarbComply - Bulgaria" },
            { lat: 48.2082, lng: 16.3738, name: "Austria", fullName: "CarbComply - Austria" },
            { lat: 78.2232, lng: 15.6267, name: "Arctic", fullName: "Arctic: Ocean Eddies Detection" }
        ];

        // --- GLOBE CONFIG ---
        const layers = {
            topo: { 
                img: '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg', 
                bump: '//unpkg.com/three-globe/example/img/earth-topology.png' 
            },
            night: { 
                img: '//unpkg.com/three-globe/example/img/earth-night.jpg', 
                bump: null 
            },
            dynamics: { 
                img: '//unpkg.com/three-globe/example/img/earth-water.png', 
                bump: null 
            }
        };

        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl(layers.topo.img)
            .bumpImageUrl(layers.topo.bump)
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#00ffcc')
            // Rings
            .ringsData(myProjects)
            .ringColor(() => '#00ffcc')
            .ringMaxRadius(2)
            .ringPropagationSpeed(1)
            .ringRepeatPeriod(2000)
            // Labels
            .labelsData(myProjects)
            .labelText('name')
            .labelSize(1.5)
            .labelColor(() => '#fff')
            .onLabelClick(openProject);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // --- FUNCTIONS ---
        function updateGlobeLayer(key, btn) {
            // Update the textures
            world.globeImageUrl(layers[key].img);
            if (layers[key].bump) {
                world.bumpImageUrl(layers[key].bump);
            } else {
                world.bumpImageUrl(''); // Clear bump map for non-topo layers
            }

            // UI feedback
            document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // IMPORTANT: Force re-render of projects so they don't disappear
            world.ringsData(myProjects);
            world.labelsData(myProjects);
        }

        function toggleSidebar() { document.getElementById('mySidebar').classList.toggle('open'); }
        
        function openProject(data) {
            document.getElementById('modalTitle').innerText = data.fullName;
            document.getElementById('modalBody').innerText = data.desc || "Details for this Earth Observation project are loading...";
            document.getElementById('projectModal').style.display = 'block';
            world.controls().autoRotate = false;
        }

        function closeModals() {
            document.getElementById('projectModal').style.display = 'none';
            world.controls().autoRotate = true;
        }

        // Initialize Project List in Sidebar
        const list = document.getElementById('project-list');
        myProjects.forEach(p => {
            const item = document.createElement('div');
            item.style.padding = '10px 0';
            item.style.borderBottom = '1px solid #222';
            item.style.cursor = 'pointer';
            item.style.fontSize = '0.85rem';
            item.innerHTML = p.fullName;
            item.onclick = () => { openProject(p); toggleSidebar(); };
            list.appendChild(item);
        });

        window.onclick = e => { if(e.target.className === 'modal-overlay') closeModals(); }
    </script>
</body>
</html>

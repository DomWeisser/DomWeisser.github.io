<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic Weisser | AI & Earth Observation</title>
    
    <script src="//unpkg.com/three@0.148.0/build/three.min.js"></script>
    <script src="//unpkg.com/globe.gl@2.26.4/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --accent-color: #00ffcc;
            --bg-color: #050505;
            --sidebar-bg: rgba(10, 14, 20, 0.95);
            --text-color: #f0f0f0;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* --- UI: HEADER --- */
        .header-overlay { 
            position: absolute; top: 30px; left: 90px; z-index: 10; pointer-events: none;
            border-left: 3px solid var(--accent-color); padding-left: 20px;
        }
        h1 { margin: 0; font-family: 'Rajdhani', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px rgba(0,255,204,0.4); }
        .subtitle { color: var(--accent-color); font-size: 0.9rem; margin-top: 5px; font-weight: 600; letter-spacing: 1px; }

        /* --- UI: CONTROLS --- */
        .menu-btn { 
            position: fixed; top: 30px; left: 25px; z-index: 50;
            background: rgba(0,0,0,0.6); border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 12px; border-radius: 4px; cursor: pointer; transition: 0.3s;
            font-family: 'Rajdhani', sans-serif; font-weight: bold; font-size: 1.2rem;
        }
        .menu-btn:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color); }

        .layer-panel {
            position: fixed; bottom: 30px; right: 30px; z-index: 20;
            background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 20px;
            border-radius: 8px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .layer-title { font-size: 0.7rem; color: #888; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }
        .layer-btn {
            background: transparent; border: 1px solid #444; color: #aaa;
            padding: 10px 15px; font-size: 0.8rem; cursor: pointer; text-align: left;
            transition: 0.2s; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; font-weight: 600;
        }
        .layer-btn:hover { color: #fff; border-color: #fff; }
        .layer-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: rgba(0,255,204,0.1); }

        /* --- SIDEBAR --- */
        .sidebar { 
            position: fixed; left: 0; top: 0; width: 360px; height: 100%; 
            background: var(--sidebar-bg); z-index: 40; transform: translateX(-100%); 
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1); padding: 100px 30px; box-sizing: border-box; 
            border-right: 1px solid #333; overflow-y: auto; 
        }
        .sidebar.open { transform: translateX(0); }
        .close-sidebar { position: absolute; top: 30px; right: 30px; cursor: pointer; color: #666; font-size: 1.5rem; }

        .menu-section-btn { 
            width: 100%; text-align: left; background: none; border: none; 
            color: #fff; font-size: 1.1rem; font-weight: 600; padding: 20px 0; 
            border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between;
        }
        .menu-content { display: none; padding: 10px 0 10px 15px; }
        .menu-content.show { display: block; animation: fadeIn 0.3s; }
        
        .project-link { 
            display: block; padding: 12px 0; color: #aaa; cursor: pointer; 
            font-size: 0.95rem; transition: 0.2s; border-left: 2px solid transparent; padding-left: 10px;
        }
        .project-link:hover { color: var(--accent-color); border-left: 2px solid var(--accent-color); background: rgba(255,255,255,0.02); }

        /* --- THE MARKERS (The "Dots") --- */
        /* Crucial Fix: High z-index ensures they are never hidden by layers */
        .project-dot {
            width: 14px; height: 14px;
            background-color: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-color);
            position: relative;
            transform: translate(-50%, -50%);
            z-index: 10000; /* FIXED: Must be extremely high */
            pointer-events: auto;
        }
        /* Clickable Area */
        .project-dot::before {
            content: ""; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
        }
        /* Pulse Effect */
        .project-dot::after {
            content: ""; position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            border: 1px solid var(--accent-color); border-radius: 50%;
            transform: translate(-50%, -50%); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { width: 100%; opacity: 1; } 100% { width: 300%; opacity: 0; } }
        .project-dot:hover { background-color: #fff; transform: translate(-50%, -50%) scale(1.4); }

        /* --- MODALS --- */
        .modal-overlay { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { background: #0b0f15; margin: 5% auto; padding: 40px; border: 1px solid #333; width: 80%; max-width: 900px; border-radius: 6px; position: relative; color: #ccc; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .close-modal { position: absolute; top: 20px; right: 20px; color: #fff; cursor: pointer; font-size: 2rem; }
        .btn { display: inline-block; background: var(--accent-color); color: #000; padding: 12px 24px; text-decoration: none; border-radius: 2px; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; font-family: 'Rajdhani'; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;}
        .btn-outline { background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); margin-left: 10px; }

        /* IMAGES & SLIDER */
        .about-img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .about-img { width: 100%; border: 1px solid #333; border-radius: 4px; }
        .about-caption { font-size: 0.8rem; color: #777; margin-top: 8px; text-align: center; font-style: italic; }
        
        /* SLIDER CSS (Restored from your original) */
        .comparison-container { position: relative; width: 100%; max-width: 800px; margin: 20px auto; border: 1px solid #444; line-height: 0; overflow: hidden; border-radius: 4px; }
        .img-overlay { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; border-right: 2px solid var(--accent-color); z-index: 2; }
        .img-overlay::after {
            content: '↔'; position: absolute; top: 50%; right: -16px; transform: translateY(-50%);
            width: 32px; height: 32px; background-color: var(--accent-color); color: #000;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; pointer-events: none; z-index: 20; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .img-overlay img { width: 100%; max-width: none; height: auto; } 
        .slider-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; z-index: 10; margin: 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <div id="globeViz"></div>

    <div class="header-overlay">
        <h1>Dominic Weisser</h1>
        <div class="subtitle">MSc AI for Sustainable Development - UCL</div>
    </div>

    <button class="menu-btn" onclick="toggleSidebar()">☰ MENU</button>

    <div class="layer-panel">
        <div class="layer-title">SENSOR LAYERS</div>
        <button id="btn-topo" class="layer-btn active" onclick="setLayer('topo')">01. TOPOGRAPHY & TERRAIN</button>
        <button id="btn-night" class="layer-btn" onclick="setLayer('night')">02. SOCIO-ECONOMIC (NIGHT)</button>
        <button id="btn-dynamics" class="layer-btn" onclick="setLayer('dynamics')">03. ATMOSPHERE & DYNAMICS</button>
    </div>

    <div class="sidebar" id="mySidebar">
        <div class="close-sidebar" onclick="toggleSidebar()">✕</div>
        <button class="menu-section-btn" onclick="openAbout()">About Me <span>&rarr;</span></button>
        
        <button class="menu-section-btn" onclick="toggleAccordion('project-list-wrapper')">Projects <span>&#9662;</span></button>
        <div id="project-list-wrapper" class="menu-content"></div>

        <button class="menu-section-btn" onclick="toggleAccordion('contact-wrapper')">Contact / CV <span>&#9662;</span></button>
        <div id="contact-wrapper" class="menu-content">
            <div style="font-size: 0.9rem; margin-bottom: 15px; color: #aaa;">
                <span style="color:var(--accent-color)">Email:</span> dweisser99@gmail.com
            </div>
            <button class="btn" onclick="openCV()" style="width:100%">View My CV</button>
        </div>
    </div>

    <div id="projectModal" class="modal-overlay"><div class="modal-content"><span class="close-modal" onclick="closeAllModals()">&times;</span><h2 id="modalTitle" style="color: var(--accent-color); margin-top: 0;"></h2><div id="modalBody" style="line-height: 1.6;"></div><div id="modalLinks" style="margin-top: 25px;"></div></div></div>
    <div id="aboutModal" class="modal-overlay"><div class="modal-content"><span class="close-modal" onclick="closeAllModals()">&times;</span><h2 style="color: var(--accent-color);">My Journey</h2><div id="aboutBody" style="line-height: 1.8; color: #ddd;"></div></div></div>
    <div id="cvModal" class="modal-overlay"><div class="modal-content" style="width: 90%; height: 90%; max-width: none;"><span class="close-modal" onclick="closeAllModals()">&times;</span><iframe id="cvFrame" src="" style="width: 100%; height: 100%; border: none; background: #fff;"></iframe></div></div>

    <script>
        // --- 1. DATA ---
        const myProjects = [
            { lat: -1.2921, lng: 36.8219, name: "Kenya", fullName: "EOAgriTwin - Kenya", desc: "Loading...", externalFile: "project-kenya.html" },
            { lat: 54.1153, lng: 4.3162, name: "Northern Europe", fullName: "MSc Dissertation: Cross-Domain Offshore Wind Power Forecasting", desc: "My MSc dissertation, supervised by Professor Benjami Guedj, investigates the application of transfer learning through weather specific models.", pdf: "CI_WPF_TL.pdf", github: "https://github.com/DomWeisser/offshore-wind-forecasting-2026" },
            { lat: 41.9028, lng: 12.4964, name: "Italy", fullName: "EOAgriTwin - Italy", desc: "Loading...", externalFile: "project-italy.html" },
            { lat: -15.8267, lng: -47.9218, name: "Brazil", fullName: "Amazon Basin Groundwater Monitoring", desc: "Loading...", externalFile: "project-brazil.html", github: "https://github.com/DomWeisser/Multi-Scale-Groundwater-Monitoring-in-the-Amazon" },
            { lat: 42.6977, lng: 23.3219, name: "Bulgaria", fullName: "CarbComply - Bulgaria", desc: "Loading...", externalFile: "project-bulgaria.html" },
            { lat: 48.2082, lng: 16.3738, name: "Austria", fullName: "CarbComply - Austria", desc: "Loading...", externalFile: "project-austria.html" },
            { lat: 78.2232, lng: 15.6267, name: "Arctic", fullName: "Arctic: Ocean Eddies Detection", desc: "Loading...", externalFile: "project-arctic.html", github: "https://github.com/DomWeisser/Detecting-and-Calculating-SSHA-of-Ocean-Eddies" }
        ];

        // --- 2. GLOBE INIT ---
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#00ffcc')
            .atmosphereDaylightAlpha(0.2)
            
            // USE HTML MARKERS (Reliable)
            .htmlElementsData(myProjects)
            .htmlLat('lat')
            .htmlLng('lng')
            .htmlElement(d => {
                const el = document.createElement('div');
                el.className = 'project-dot';
                el.onclick = (e) => { e.stopPropagation(); openProjectModal(d); };
                return el;
            });

        // --- 3. DYNAMIC CLOUDS & LIGHTING ---
        const scene = world.scene();
        
        // A. Lighting (Critical for 3D Bump)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(15, 10, 5);
        scene.add(dirLight);

        // B. Cloud Layer (The Fix for "Dynamics")
        let cloudSphere;
        const cloudTexture = new THREE.TextureLoader().load('//unpkg.com/three-globe/example/img/earth-clouds.png');
        const cloudGeometry = new THREE.SphereGeometry(world.getGlobeRadius() * 1.02, 64, 64);
        const cloudMaterial = new THREE.MeshPhongMaterial({ map: cloudTexture, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
        cloudSphere = new THREE.Mesh(cloudGeometry, cloudMaterial);
        cloudSphere.visible = false; // Hidden by default
        scene.add(cloudSphere);

        // Animation Loop for Clouds
        (function animate() {
            if (cloudSphere.visible) cloudSphere.rotation.y += 0.0005;
            requestAnimationFrame(animate);
        })();

        // --- 4. LAYER SWITCHER ---
        function setLayer(type) {
            document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');

            if (type === 'topo') {
                world.globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
                world.bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');
                cloudSphere.visible = false;
            } else if (type === 'night') {
                world.globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg');
                world.bumpImageUrl(null);
                cloudSphere.visible = false;
            } else if (type === 'dynamics') {
                // Digital Twin Mode: Blue Marble + Moving Clouds
                world.globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
                world.bumpImageUrl(null);
                cloudSphere.visible = true;
            }
        }

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // --- 5. UI & MODAL LOGIC (Standard) ---
        function toggleSidebar() { document.getElementById('mySidebar').classList.toggle('open'); }
        function toggleAccordion(id) { document.getElementById(id).classList.toggle('show'); }
        function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); world.controls().autoRotate = true; }

        function openProjectModal(data) {
            closeAllModals();
            const modal = document.getElementById("projectModal");
            document.getElementById("modalTitle").innerText = data.fullName;
            const body = document.getElementById("modalBody");
            const links = document.getElementById("modalLinks");
            
            links.innerHTML = "";
            if (data.pdf) links.innerHTML += `<a href="${data.pdf}" target="_blank" class="btn">Full Paper</a> `;
            if (data.github) links.innerHTML += `<a href="${data.github}" target="_blank" class="btn btn-outline">Repo</a>`;

            if (data.externalFile) {
                body.innerHTML = 'Loading...';
                fetch(data.externalFile).then(r => r.text()).then(html => {
                    body.innerHTML = html;
                    if(document.getElementById("slider")) setTimeout(resizeComparisonImage, 100);
                });
            } else {
                body.innerHTML = data.desc;
            }
            modal.style.display = "block";
            world.controls().autoRotate = false;
        }

        function openAbout() {
            closeAllModals();
            // Fill About content (Original Text)
            const aboutText = `
                <p>I am a AI researcher and Data Scientist dedicated to leveraging machine learning to solve environmental challenges. Born in Thailand and raised across Germany, Turkey, Qatar, and Spain, I developed an early appreciation for the natural world and a firsthand understanding of how environmental changes disproportionately impact different regions. My academic journey began at the University of Warwick with a BMORSE (Mathematics, Operational Research, Statistics, and Economics) which focused heavily on pure mathematical and statistical theory. This led me to roles as an Actuarial Graduate and to sport statistics. While these experiences sharpened my analytical toolkit, I realised I wanted to apply these skills to problems that resonated more deeply with my personal values.</p>
                <p>Consequently, I pivoted to an MSc in AI for Sustainable Development at UCL, moving from traditional statistics to advanced Deep Learning. Through my masters and my time working at Remote Sensing Solutions in Munich, I have worked on geospatial projects ranging from using computer vision to extract insights from satellite imagery and analysing acoustic patterns for biodiversity monitoring to leveraging LLMs for natural language processing tasks. While my research interests primarily focus on disaster response and water sustainability - from coral reef protection to coastal monitoring to aquifer quantification - I am driven by curiosity and eager to tackle challenges across the AI4EO landscape.</p>
                <div class="about-img-grid">
                    <div><img src="IMG_2574.jpg" class="about-img"><div class="about-caption">Hiking to Rakaposhi basecamp in Pakistan</div></div>
                    <div><img src="IMG_9090.jpg" class="about-img"><div class="about-caption">Summit of Mt Semeru, Java</div></div>
                </div>`;
            document.getElementById('aboutBody').innerHTML = aboutText;
            document.getElementById('aboutModal').style.display = 'block';
            toggleSidebar();
            world.controls().autoRotate = false;
        }

        function openCV() { closeAllModals(); document.getElementById('cvFrame').src = "CV 2026.pdf"; document.getElementById('cvModal').style.display = 'block'; toggleSidebar(); world.controls().autoRotate = false; }

        // Slider Logic (Restored)
        function moveSlider() { const s = document.getElementById("slider"), o = document.getElementById("imgOverlay"); if(s && o) o.style.width = s.value + "%"; }
        function resizeComparisonImage() { const c = document.getElementById("comparisonContainer"), i = document.querySelector("#imgOverlay img"); if(c && i) i.style.width = c.offsetWidth + "px"; }
        window.addEventListener('resize', resizeComparisonImage);

        // Populate Sidebar
        const list = document.getElementById('project-list-wrapper');
        myProjects.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-link';
            div.innerHTML = `> ${p.fullName}`;
            div.onclick = () => { openProjectModal(p); toggleSidebar(); };
            list.appendChild(div);
        });
        
        window.onclick = e => { if (e.target.className === 'modal-overlay') closeAllModals(); }
    </script>
</body>
</html>
